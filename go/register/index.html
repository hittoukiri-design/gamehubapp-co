<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="refresh" content="0;url=https://gamehub.org/#/register?invitationCode=72238107987">
  <title>GameHub Register Redirect</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #050805;
      --panel: #0e1710;
      --line: rgba(81, 255, 126, .24);
      --text: #f3fff4;
      --muted: #b8c6b9;
      --accent: #21c45a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 0%, rgba(33, 196, 90, .18), transparent 34%),
        var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }
    main {
      width: min(100%, 520px);
      padding: 32px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(14, 23, 16, .96), rgba(6, 10, 7, .96));
      box-shadow: 0 22px 80px rgba(0, 0, 0, .38);
      text-align: center;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.05;
    }
    p {
      margin: 0 auto 22px;
      max-width: 38rem;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.6;
    }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--accent);
      color: #031006;
      font-weight: 800;
      text-decoration: none;
    }
    small {
      display: block;
      margin-top: 18px;
      color: #7e8d80;
    }
  </style>
  <script>
    window.location.replace('https://gamehub.org/#/register?invitationCode=72238107987');
  </script>
</head>
<body>
  <main>
    <h1>Opening GameHub Register</h1>
    <p>The official GameHub registration page is opening with invite code <strong>72238107987</strong> applied.</p>
    <a href="https://gamehub.org/#/register?invitationCode=72238107987" rel="nofollow">Continue to Register</a>
    <small>If the page does not open automatically, use the button above.</small>
  </main>
</body>
</html>
