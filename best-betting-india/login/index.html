<body>
<main class="phone">
  <div class="top"><a class="back" href="/" aria-label="Back">‹</a><div class="lang"><span class="flag">🇮🇳</span><span>EN⌄</span></div></div>
  <div class="logo"><img src="/assets/img/yaarwin-yw-logo-small.webp?v=perf301" alt="YaarWin"></div>
  <h1>Log in</h1>
  <p class="intro">Please log in with your phone number or email<br>If you forget your password, please contact customer service</p>
  <section class="card" aria-label="YaarWin login form">
    <div class="tabs"><button class="tab active" type="button" data-tab="phone"><span class="ico">▯</span><span>Phone Number</span></button><button class="tab" type="button" data-tab="email"><span class="ico">✉</span><span>Email Login</span></button></div>
    <form action="#" onsubmit="return false">
      <div id="phoneField"><div class="label"><span class="ico">▯</span><span>Phone number</span></div><div class="row"><div class="select">+91 <span>⌄</span></div><input class="input" type="tel" placeholder="Please enter the phone number"></div></div>
      <div id="emailField" class="hidden"><div class="label"><span class="ico">✉</span><span>Email address</span></div><input class="input" type="email" placeholder="Please enter your email"></div>
      <div class="label"><span class="ico">▣</span><span>Password</span></div><div class="password"><input class="input" type="password" placeholder="Password"><span class="eye">◉</span></div>
      <label class="remember"><span class="circle"></span><span>Remember password</span></label>
      <button class="login-btn" type="submit">Log in</button>
      <a class="register-btn" href="#register">Register</a>
      <div class="bottom"><div class="help"><span class="big">▣</span><span>Forgot password</span></div><span class="line"></span><div class="help"><span class="big">☏</span><span>Customer Service</span></div></div>
    </form>
  </section>
</main>
<script>const tabs=document.querySelectorAll('.tab'),phone=document.getElementById('phoneField'),email=document.getElementById('emailField');tabs.forEach(t=>t.addEventListener('click',()=>{tabs.forEach(x=>x.classList.remove('active'));t.classList.add('active');const isPhone=t.dataset.tab==='phone';phone.classList.toggle('hidden',!isPhone);email.classList.toggle('hidden',isPhone);}));</script>
