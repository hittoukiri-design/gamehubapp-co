<script id="yw-final-header-js">
(function(){
  function initYwFinalHeader(){
    document.querySelectorAll('[data-yw-final-header]').forEach(function(header){
      var btn = header.querySelector('[data-yw-menu]');
      if(!btn || btn.dataset.ywBound === '1') return;
      btn.dataset.ywBound = '1';
      btn.addEventListener('click', function(e){
        e.preventDefault();
        e.stopPropagation();
        var isOpen = header.classList.toggle('yw-menu-open');
        btn.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
    });
    document.addEventListener('click', function(e){
      document.querySelectorAll('[data-yw-final-header]').forEach(function(header){
        if(header.contains(e.target)) return;
        header.classList.remove('yw-menu-open');
        var btn = header.querySelector('[data-yw-menu]');
        if(btn) btn.setAttribute('aria-expanded','false');
      });
    });
  }
  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', initYwFinalHeader);
  }else{
    initYwFinalHeader();
  }
})();
</script>
